spring:
  application:
    name: nutribot

  datasource:
    url: jdbc:h2:mem:nutribot

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

  # Modelo de IA: qualquer API compatível com a da OpenAI, configurada por variáveis de ambiente.
  # Nunca coloque a chave aqui: o repositório é público.
  # Padrão: Google Gemini pelo endpoint compatível com a OpenAI (só falta definir OPENAI_API_KEY).
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:not-set}
      base-url: ${OPENAI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
      chat:
        options:
          model: ${OPENAI_MODEL:gemini-2.5-flash}
          temperature: 0.3
      embedding:
        options:
          model: ${OPENAI_EMBEDDING_MODEL:gemini-embedding-001}

server:
  port: 8080
